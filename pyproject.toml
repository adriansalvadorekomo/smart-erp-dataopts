[project]
name = "smart-erp"
version = "0.1.0"
description = "DataOps-driven ERP for e-commerce — Databricks Lakehouse (Bronze/Silver/Gold) over PostgreSQL OLTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # Backend/ML runtime (see decisions: local-first, CPU-only).
    # torch rides the CPU index below — PyPI's default wheel drags ~2GB of
    # CUDA that no target here (CI, slim image, laptop) can use.
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "prophet>=1.4.0",
    "psycopg[binary]>=3.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
