[project]
name = "smart-erp"
version = "0.1.0"
description = "DataOps-driven ERP for e-commerce — Databricks Lakehouse (Bronze/Silver/Gold) over PostgreSQL OLTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # Lakehouse pure-logic + OLTP tooling need stdlib only (unittest, no cluster).
    # Cluster/runtime deps (pyspark, delta-spark, mlflow, databricks-connect) are
    # introduced with the Phase-8 backfill/training increment — not ahead of need.
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]
