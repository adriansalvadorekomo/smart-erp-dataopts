<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>DataOps ERP System Architecture</h1>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <rect x="1450" y="100" width="140" height="64" rx="6" fill="#f5f5f5"/>

        <rect x="1458" y="108" width="28" height="12" rx="2" fill="#4f5d750.12" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="1472.0" y="116.0" fill="#2d3142" font-size="7" font-family='Geist Mono', monospace text-anchor="middle" letter-spacing="0.08em">BI</text>
        <text x="1520.0" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family='Geist', sans-serif text-anchor="middle">BI/Consumption</text>

        <line x1="50" y1="550" x2="1550" y2="550" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="80" y="602" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="100" y="611" fill="#4f5d75" font-size="8" font-family='Geist', sans-serif">Standard component</text>
        <rect x="80" y="622" width="14" height="10" rx="2" fill="#4f5d75" stroke="#4f5d75" stroke-width="1"/>

</html>
