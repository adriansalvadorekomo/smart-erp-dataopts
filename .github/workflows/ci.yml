name: CI

# Trunk-Based Development gate (see docs/branching-strategy.md §5).
# Runs against every pull request into main and every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lockfile:
    name: uv — lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Verify lockfile matches pyproject.toml
        run: uv lock --check

  lint:
    name: Python — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Byte-compile Python sources
        run: uv run python -m compileall -q backend ml rag scripts 2>/dev/null || true
      - name: Verify uv-generated import graph is healthy
        run: uv tree --depth 1

  lakehouse-test:
    name: Lakehouse — unit tests (no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Run lakehouse unit tests (stdlib unittest)
        run: uv run python -m unittest discover -s lakehouse/tests -v
      - name: Local end-to-end mirror (bronze → silver → DQ → gold)
        run: uv run python lakehouse/local_run.py
      - name: Validate Workflows job definition
        run: uv run python -c "import json; d=json.load(open('lakehouse/workflows/smart_erp_job.json')); assert [t['task_key'] for t in d['tasks']]==['bronze_ingest','silver_build','dq_gate','gold_build','sql_refresh'], 'task order drift'"

  sql-parse:
    name: Lakehouse SQL — Gold models sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert Gold SQL models stay inside the medallion (never OLTP/raw)
        run: |
          ! grep -ri 'public\.\|raw\.purchases\|staging\.' lakehouse/sql/gold/ || { echo "Gold must not read OLTP/raw/staging directly"; exit 1; }
          for f in lakehouse/sql/gold/*.sql; do
            grep -q 'silver\.\|gold\.' "$f" || { echo "$f reads outside the medallion"; exit 1; }
          done
          echo "Gold SQL sources OK:"; ls lakehouse/sql/gold/
      - name: Assert estimated-margin labelling (no silent COGS claims)
        run: |
          grep -l 'estimated_line_margin' lakehouse/sql/gold/fact_sales.sql

  terraform-validate:
    name: Terraform — validate workspace assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate (no backend, no apply on Free Edition CI)
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate

  database-sanity:
    name: PostgreSQL — migrations + schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: smart
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: ./database/apply.sh
      - name: Assert core tables exist
        run: psql -d smart -v ON_ERROR_STOP=1 -c "\dt public.*"
      - name: Verify invariants (final_price check present)
        run: >
          psql -d smart -v ON_ERROR_STOP=1 -Atc
          "SELECT count(*) FROM pg_constraint
           WHERE conname LIKE '%final_price%' OR conname LIKE '%delivery_status%';"

  backend-test:
    name: Backend — pytest (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: smart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: smart
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Run backend tests (Alembic migrate + orders API on throwaway DB)
        run: uv run pytest backend/tests -q

  seed-acceptance-note:
    name: Docs — OLTP contract stays consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert OLTP contract docs stay consistent
        run: |
          grep -q 'final_price' docs/business-model.md
          grep -q 'lakehouse' README.md
          # Full 1M-row seed acceptance needs the git-ignored CSV, so it runs
          # locally (scripts/seed/README.md), not here; the lakehouse DQ rules
          # R1–R9 mirror its checks so the contract cannot drift (docs/lakehouse.md §7).